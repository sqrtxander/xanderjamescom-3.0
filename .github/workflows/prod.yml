name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: ap-southeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read


    steps:
      - name: Get Github action IP
        id: ip
        run: |
          IP=""
          for url in "https://api.ipify.org" "https://checkip.amazonaws.com" "https://ifconfig.me"; do
            IP=$(curl -s --max-time 5 --retry 3 --retry-delay 2 "$url" || true)
            IP=$(echo "$IP" | tr -d '[:space:]')
            if [[ "$IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
              break
            fi
          done
          if [[ -z "$IP" ]]; then
            echo "Failed to determine public IP" >&2
            exit 1
          fi
          echo "ipv4=$IP" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Add Github Actions IP to Security group
        run: |
          aws ec2 authorize-security-group-ingress \
          --group-name ${{ secrets.AWS_SG_NAME }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo -u www-data /usr/local/bin/deploy.sh

      - name: Remove Github Actions IP from security group
        run: |
          aws ec2 revoke-security-group-ingress \
          --group-name ${{ secrets.AWS_SG_NAME }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32
        if: always()


